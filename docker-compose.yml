services:
  postgres:
    image: postgres:16-alpine
    container_name: fraudwatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FW_DB_NAME:-fraudwatch}
      POSTGRES_USER: ${FW_DB_USER:-fraudwatch_app}
      POSTGRES_PASSWORD: ${FW_DB_PASSWORD:-local_only_change_me}
    ports:
      - "${FW_DB_PORT:-5433}:5432"
    volumes:
      - fraudwatch_pgdata:/var/lib/postgresql/data
      - ./sql/001_source_schema.sql:/docker-entrypoint-initdb.d/001_source_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FW_DB_USER:-fraudwatch_app} -d ${FW_DB_NAME:-fraudwatch}"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  fraudwatch_pgdata:
